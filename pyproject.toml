[project]
name = "segmentation-tools"
version = "0.1.0"
description = "Abstraction interface for AI detection models loading, inference and training"
readme = "README.md"
requires-python = "==3.8.*"
dependencies = [
    "pillow",
    "pyyaml>=6.0.3",
    "torch",
    "tqdm>=4.67.1",
    "transformers",
    "ultralytics",
]

[tool.uv.sources]
torch = { url = "https://developer.download.nvidia.cn/compute/redist/jp/v512/pytorch/torch-2.1.0a0+41361538.nv23.06-cp38-cp38-linux_aarch64.whl" }

